[package]
name = "bachuc-plugin-watchtower-board"
version = "0.1.0"
edition = "2024"
publish = false

# The native client of `hiep-plugins/plugins/watchtower-board` (ADR-0045). Never depends on a view
# crate or on another plugin crate.
[dependencies]
anyhow = "1"
bachuc-client = { path = "../../crates/client" }
bachuc-icons = { path = "../../crates/icons" }
bachuc-plugin-host = { path = "../../crates/plugin-host" }
bachuc-theme = { path = "../../crates/theme" }
gpui-kit.workspace = true
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
