[package]
name = "bachuc-plugin-board"
version = "0.1.0"
edition = "2024"
publish = false

# The native client of `hiep-plugins/plugins/board` (ADR-0045). Never depends on a view crate or
# another plugin crate.
[dependencies]
anyhow = "1"
bachuc-client = { path = "../../crates/client" }
bachuc-icons = { path = "../../crates/icons" }
bachuc-plugin-host = { path = "../../crates/plugin-host" }
bachuc-theme = { path = "../../crates/theme" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gpui-kit.workspace = true
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
