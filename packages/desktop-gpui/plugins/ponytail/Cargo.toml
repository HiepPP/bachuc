[package]
name = "bachuc-plugin-ponytail"
version = "0.1.0"
edition = "2024"
publish = false

# The native client of `hiep-plugins/plugins/ponytail` (ADR-0045, ADR-0079). Never depends on a
# view crate or on another plugin crate.
[dependencies]
anyhow = "1"
bachuc-client = { path = "../../crates/client" }
bachuc-plugin-host = { path = "../../crates/plugin-host" }
gpui-kit.workspace = true
log = "0.4"
serde_json = "1"
