[package]
name = "bachuc-plugin-selection-translate"
version = "0.1.0"
edition = "2024"
publish = false

# The native client of `hiep-plugins/plugins/selection-translate` (ADR-0062, ADR-0063). Never
# depends on a view crate or on another plugin crate.
[dependencies]
anyhow = "1"
bachuc-icons = { path = "../../crates/icons" }
bachuc-plugin-host = { path = "../../crates/plugin-host" }
gpui-kit.workspace = true
log = "0.4"
serde_json = "1"
