[package]
name = "bachuc-composer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bachuc-client = { path = "../client" }
bachuc-command = { path = "../command" }
bachuc-icons = { path = "../icons" }
bachuc-plugin-host = { path = "../plugin-host" }
bachuc-sidebar = { path = "../sidebar" }
bachuc-theme = { path = "../theme" }
gpui-kit.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
log = "0.4"
serde_json = "1"

[dev-dependencies]
futures = "0.3"
