[package]
name = "bachuc-diagram"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit.workspace = true
# `transparent` lets the snapshots keep the row background behind the diagram.
wry = { version = "0.53.3", package = "lb-wry", features = ["transparent"] }
raw-window-handle = { version = "0.6", features = ["std"] }
serde_json = "1"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# wry has no snapshot API, so the crate calls WKWebView takeSnapshot itself (ADR-0037).
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = [
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKSnapshotConfiguration",
    "WKWebView",
] }
