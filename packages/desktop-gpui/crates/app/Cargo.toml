[package]
name = "bachuc-app"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bachuc-desktop"
path = "src/main.rs"

[dependencies]
bachuc-client = { path = "../client" }
bachuc-command = { path = "../command" }
bachuc-composer = { path = "../composer" }
bachuc-diagram = { path = "../diagram" }
bachuc-explorer = { path = "../explorer" }
bachuc-history = { path = "../history" }
bachuc-icons = { path = "../icons" }
bachuc-plugin-assistant-cite = { path = "../../plugins/assistant-cite" }
bachuc-plugin-board = { path = "../../plugins/board" }
bachuc-plugin-claude-look = { path = "../../plugins/claude-look" }
bachuc-plugin-edit-diffs = { path = "../../plugins/edit-diffs" }
bachuc-plugin-host = { path = "../plugin-host" }
bachuc-plugin-idle-runtime-closer = { path = "../../plugins/idle-runtime-closer" }
bachuc-plugin-jev-orchestrator = { path = "../../plugins/jev-orchestrator" }
bachuc-plugin-next-prompt-actions = { path = "../../plugins/next-prompt-actions" }
bachuc-plugin-plugins-nav = { path = "../../plugins/plugins-nav" }
bachuc-plugin-prompt-translate = { path = "../../plugins/prompt-translate" }
bachuc-plugin-skill-pins = { path = "../../plugins/skill-pins" }
bachuc-plugin-stop-orb = { path = "../../plugins/stop-orb" }
bachuc-plugin-thread-branch = { path = "../../plugins/thread-branch" }
bachuc-plugin-thread-context-attach = { path = "../../plugins/thread-context-attach" }
bachuc-plugin-watchtower-board = { path = "../../plugins/watchtower-board" }
bachuc-plugin-workspace-spaces = { path = "../../plugins/workspace-spaces" }
bachuc-settings = { path = "../settings" }
bachuc-sidebar = { path = "../sidebar" }
bachuc-terminal = { path = "../terminal" }
bachuc-theme = { path = "../theme" }
bachuc-timeline = { path = "../timeline" }
bachuc-workspace = { path = "../workspace" }
gpui-kit.workspace = true
log = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI has no dock badge API, so the badge goes through NSDockTile.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
