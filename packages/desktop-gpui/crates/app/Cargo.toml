[package]
name = "bachuc-app"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bachuc-desktop"
path = "src/main.rs"

[dependencies]
bachuc-client = { path = "../client" }
bachuc-command = { path = "../command" }
bachuc-composer = { path = "../composer" }
bachuc-diagram = { path = "../diagram" }
bachuc-explorer = { path = "../explorer" }
bachuc-icons = { path = "../icons" }
bachuc-settings = { path = "../settings" }
bachuc-sidebar = { path = "../sidebar" }
bachuc-terminal = { path = "../terminal" }
bachuc-theme = { path = "../theme" }
bachuc-timeline = { path = "../timeline" }
bachuc-workspace = { path = "../workspace" }
gpui-kit.workspace = true
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI has no dock badge API, so the badge goes through NSDockTile.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
