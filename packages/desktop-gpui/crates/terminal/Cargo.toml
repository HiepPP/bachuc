[package]
name = "bachuc-terminal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bachuc-client = { path = "../client" }
bachuc-theme = { path = "../theme" }
# gpui-kit pins GPUI to the gpui-pre 0.3.9 snapshot; keep the same pin in every crate.
gpui-kit = "=0.7.3"
alacritty_terminal = "0.26"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
