[package]
name = "decider-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone on purpose (ADR-0066): no gpui-kit and no other workspace crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain http only: the Decider server is local or on the LAN, so no TLS stack is built.
ureq = { version = "3", default-features = false }
