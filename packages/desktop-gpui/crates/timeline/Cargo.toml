[package]
name = "bachuc-timeline"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bachuc-client = { path = "../client" }
bachuc-diagram = { path = "../diagram" }
# Syntax colors of code and diffs in tool details, shared with the file viewer.
bachuc-explorer = { path = "../explorer" }
bachuc-icons = { path = "../icons" }
bachuc-plugin-host = { path = "../plugin-host" }
bachuc-theme = { path = "../theme" }
gpui-kit.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
log = "0.4"
serde_json = "1"
similar = "2"
